<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Operation Debt Fury: an incremental game about spending taxpayer money on an entire military." />
  <meta name="theme-color" content="#14181d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2314181d'/%3E%3Crect x='2' y='4' width='12' height='8' fill='%235fae4e'/%3E%3Crect x='3' y='5' width='10' height='6' fill='%232f6e2f'/%3E%3Crect x='7' y='5' width='2' height='6' fill='%23f2f4f5'/%3E%3C/svg%3E" />
  <title>Operation Debt Fury</title>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">$</span>
        <div>
          <div class="brand-title">OPERATION DEBT FURY</div>
          <div class="brand-sub">Department of Unlimited Appropriations</div>
        </div>
      </div>
      <button id="rank" class="rank" title="Rank"></button>
      <div id="ticker" class="ticker" title="Defense News Network"><span class="ticker-tag">DNN</span><div class="ticker-track"><span id="ticker-text"></span></div></div>
      <nav class="top-actions">
        <button data-modal="medals" class="icon-btn" title="Medals and achievements">Medals</button>
        <button data-modal="stats" class="icon-btn" title="Statistics">Stats</button>
        <button data-modal="settings" class="icon-btn" title="Settings">Settings</button>
        <button id="mute" class="icon-btn" title="Toggle sound">Sound</button>
      </nav>
    </header>

    <main id="game">
      <section id="left" class="panel col" data-tab="pallet">
        <div class="ledger">
          <div class="ledger-label">Appropriated Funds</div>
          <div id="budget" class="ledger-big">$0</div>
          <div class="ledger-row"><span>Spending rate</span><b id="rate">$0/s</b></div>
          <div class="ledger-row"><span>Spent this administration</span><b id="spent">$0</b></div>
          <div class="ledger-row"><span>Per click</span><b id="clickpow">$1</b></div>
        </div>
        <div class="pallet-wrap">
          <div id="combo"></div>
          <button id="pallet" class="pallet" aria-label="Spend money"></button>
          <div class="pallet-caption">Click to spend taxpayer money</div>
        </div>
        <div id="buffs" class="buffs"></div>
        <div class="branches">
          <div class="section-title">Service Branches</div>
          <div id="branches"></div>
        </div>
      </section>

      <section id="center" class="col" data-tab="board">
        <div class="board-frame">
          <canvas id="board"></canvas>
          <div class="board-hud">
            <div id="hud-units" class="hud-chip"></div>
            <div id="hud-capital" class="hud-chip"></div>
          </div>
        </div>
      </section>

      <section id="right" class="panel col" data-tab="store">
        <div class="tabs" role="tablist">
          <button data-tab="assets" class="tab active">Assets</button>
          <button data-tab="upgrades" class="tab">Upgrades<span class="badge" id="badge-upgrades"></span></button>
          <button data-tab="research" class="tab">R&amp;D<span class="badge" id="badge-research"></span></button>
          <button data-tab="contractors" class="tab">Contractors</button>
          <button data-tab="orders" class="tab">Administration<span class="badge" id="badge-orders"></span></button>
        </div>
        <div id="store-body" class="store-body"></div>
      </section>
    </main>

    <nav id="mobile-tabs">
      <button data-show="pallet" class="active">Pallet</button>
      <button data-show="board">Board</button>
      <button data-show="store">Store</button>
    </nav>
  </div>

  <div id="toasts"></div>
  <div id="tooltip" role="tooltip"></div>
  <div id="modal-root"></div>
  <div id="fx-layer"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
